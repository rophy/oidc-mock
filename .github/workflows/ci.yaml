name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Run unit tests
        id: coverage
        run: |
          make unit-test 2>&1 | tee /tmp/test-output.log
          pct=$(grep -oP 'coverage: \K[0-9.]+' /tmp/test-output.log | tail -1)
          echo "value=$pct" >> "$GITHUB_OUTPUT"
      - name: Update coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: dbb4822dbc5782d5563947adde3358d3
          filename: oidc-mock-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.value }}%
          valColorRange: ${{ steps.coverage.outputs.value }}
          minColorRange: 50
          maxColorRange: 100

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go run github.com/mxschmitt/playwright-go/cmd/playwright@v0.6201.1 install --with-deps chromium
      - run: make e2e-test

  build-image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate image tag
        id: tag
        run: echo "value=$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/rophy/oidc-mock:${{ steps.tag.outputs.value }}
            ghcr.io/rophy/oidc-mock:latest
