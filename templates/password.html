<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>oidc-mock — Enter Password</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { max-width: 400px; width: 100%; padding: 2rem; }
        h1 { text-align: center; margin-bottom: 0.5rem; color: #333; font-size: 1.5rem; }
        .subtitle { text-align: center; color: #666; margin-bottom: 2rem; font-size: 0.9rem; }
        .user-info { text-align: center; margin-bottom: 1.5rem; }
        .user-name { font-weight: 600; color: #333; font-size: 1.1rem; }
        .user-email { color: #666; font-size: 0.85rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: #333; font-weight: 500; }
        .form-group input { width: 100%; padding: 0.75rem; border: 2px solid #e0e0e0; border-radius: 6px; font-size: 1rem; outline: none; transition: border-color 0.15s; }
        .form-group input:focus { border-color: #4a90d9; }
        .error { color: #d9534f; font-size: 0.85rem; margin-bottom: 1rem; text-align: center; }
        .btn { width: 100%; padding: 0.75rem; background: #4a90d9; color: white; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; transition: background 0.15s; }
        .btn:hover { background: #357abd; }
    </style>
</head>
<body>
    <div class="container">
        <h1>oidc-mock</h1>
        <p class="subtitle">Enter password to continue</p>
        <div class="user-info">
            <div class="user-name">{{.User.Name}}</div>
            <div class="user-email">{{.User.Email}}</div>
        </div>
        {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
        <form method="POST" action="/authorize/callback">
            <input type="hidden" name="sub" value="{{.User.Sub}}">
            <input type="hidden" name="client_id" value="{{.ClientID}}">
            <input type="hidden" name="redirect_uri" value="{{.RedirectURI}}">
            <input type="hidden" name="state" value="{{.State}}">
            <input type="hidden" name="nonce" value="{{.Nonce}}">
            <input type="hidden" name="scope" value="{{.Scope}}">
            <input type="hidden" name="code_challenge" value="{{.CodeChallenge}}">
            <input type="hidden" name="code_challenge_method" value="{{.CodeChallengeMethod}}">
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autofocus required>
            </div>
            <button type="submit" class="btn">Sign in</button>
        </form>
    </div>
</body>
</html>
